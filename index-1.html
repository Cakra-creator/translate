<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>실시간 통역 자막</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --fg:#f2f4f8; --sub:#8b93a3; --acc:#4da3ff; --rec:#ff5c5c; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif; }
  body { display:flex; flex-direction:column; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display:flex; align-items:center; gap:8px; padding:10px 12px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--sub); flex:none; }
  .dot.on { background:var(--rec); animation:p 1.2s infinite; }
  @keyframes p { 50% { opacity:.3; } }
  #status { flex:1; font-size:12px; color:var(--sub); line-height:1.3; }
  button { font:inherit; color:var(--fg); background:var(--card); border:1px solid #2a2f3a;
    border-radius:12px; padding:9px 12px; font-size:13px; }
  button.acc { background:var(--acc); border-color:var(--acc); color:#06121f; font-weight:700; }
  #log { flex:1; overflow-y:auto; padding:6px 12px 14px; display:flex; flex-direction:column; gap:10px; }
  .item { background:var(--card); border-radius:14px; padding:12px 14px; }
  .src { font-size:14px; color:var(--sub); line-height:1.4; }
  .dst { font-size:22px; font-weight:600; line-height:1.4; margin-top:4px; word-break:keep-all; }
  .item.live { outline:1px solid #2f6db3; }
  .item.live .src { color:var(--fg); }
  #empty { color:var(--sub); text-align:center; margin:auto; font-size:15px; line-height:1.7; }
  #start { position:fixed; inset:0; background:#0f1115; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; text-align:center; padding:30px; z-index:9; }
  #start.show { display:flex; }
  #start p { color:var(--sub); font-size:14px; line-height:1.6; }
  #start button { font-size:20px; padding:16px 36px; }
  #set { position:fixed; inset:0; background:#0f1115; display:none; flex-direction:column; gap:12px;
    padding:20px; z-index:10; overflow-y:auto; }
  #set.show { display:flex; }
  #set label { font-size:13px; color:var(--sub); display:block; margin-bottom:4px; }
  #set input, #set select { width:100%; background:var(--card); color:var(--fg); border:1px solid #2a2f3a;
    border-radius:10px; padding:12px; font-size:15px; }
  #set .note { font-size:12px; color:var(--sub); line-height:1.6; }
  #set .row { display:flex; gap:8px; }
  #set .row button { flex:1; }
  #setmsg { font-size:13px; min-height:18px; }
  #err { color:#ff8a8a !important; font-weight:600; font-size:15px !important; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <span id="status">준비 중…</span>
  <button id="mode" class="acc"></button>
  <button id="clear">지우기</button>
  <button id="gear" title="AI 번역 설정">⚙️</button>
</header>
<div id="log"><div id="empty">🎧 말씀하시면 여기에<br>번역이 표시됩니다</div></div>

<div id="start">
  <h2>🎧 실시간 통역 자막</h2>
  <p>처음 한 번만 마이크 권한을 <b>허용</b>해 주세요.<br>이후엔 앱을 열면 자동으로 듣기 시작합니다.</p>
  <button id="startBtn" class="acc">시작</button>
  <p id="err"></p>
</div>

<div id="set">
  <h2>⚙️ AI 번역 설정</h2>
  <p class="note">기본 번역(구글 기계번역)보다 훨씬 자연스러운 번역을 원하면 AI 키를 넣으세요.<br>
  키는 <b>이 폰의 브라우저에만</b> 저장되고, 번역할 때만 해당 회사 서버로 전송됩니다.</p>
  <div><label>번역 엔진</label>
    <select id="prov">
      <option value="google">기본 (구글 기계번역, 무료)</option>
      <option value="claude">Claude (Anthropic)</option>
      <option value="openai">OpenAI (ChatGPT)</option>
      <option value="gemini">Gemini (Google AI)</option>
    </select></div>
  <div id="keybox"><label>API 키</label><input id="key" type="password" placeholder="sk-..." autocomplete="off"></div>
  <div id="modelbox"><label>모델 이름 (바뀔 수 있어요)</label><input id="model" type="text" autocomplete="off"></div>
  <div><label>문장 묶는 대기 시간 (말이 멈춘 뒤 번역하기까지)</label>
    <select id="pause">
      <option value="1000">짧게 (1초) - 빠르지만 더 끊김</option>
      <option value="1500">보통 (1.5초)</option>
      <option value="2500">길게 (2.5초) - 문장이 길게 이어짐</option>
    </select></div>
  <p id="setmsg"></p>
  <div class="row"><button id="test">연결 테스트</button><button id="save" class="acc">저장</button></div>
  <button id="setclose">닫기</button>
  <p class="note">· 키는 GitHub 같은 곳에 올리지 말고, 여기에만 입력하세요.<br>
  · 문장이 끝날 때마다 AI를 한 번 호출합니다. 요금이 걱정되면 해당 사이트에서 월 사용 한도를 설정해 두세요.</p>
</div>

<script>
const $ = id => document.getElementById(id);
const logEl = $('log'), statusEl = $('status'), dot = $('dot');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

const L = {
  en: { rec:'en-US', code:'en', name:'영어' },
  ko: { rec:'ko-KR', code:'ko', name:'한국어' }
};
const MODES = ['en','ko','auto'];
const LABEL = { en:'🇺🇸 영어→한글', ko:'🇰🇷 한글→영어', auto:'🔄 자동 전환' };

let mode = 'en';
try { const m = localStorage.getItem('mode'); if (MODES.includes(m)) mode = m; } catch(e){}
$('mode').textContent = LABEL[mode];

let rec = null, running = false, cur = 'en';   // cur: 지금 듣는 언어
let liveEl = null, lastFinal = '', gotResult = false, seq = 0, tTimer = null, wake = null;
let pending = '', pendEl = null, pendLang = 'en', flushTimer = null;

function setStatus(t, on){ statusEl.textContent = t; dot.classList.toggle('on', !!on); }
function showStart(msg){ $('err').textContent = msg || ''; $('start').classList.add('show'); }

function addItem(live){
  const e = $('empty'); if (e) e.remove();
  const d = document.createElement('div');
  d.className = 'item' + (live ? ' live' : '');
  d.innerHTML = '<div class="src"></div><div class="dst"></div>';
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return d;
}

async function translate(text, from, to){
  try {
    const u = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl='+from+'&tl='+to+'&dt=t&q='+encodeURIComponent(text);
    const r = await fetch(u); const j = await r.json();
    return j[0].map(x => x[0]).join('');
  } catch(e){}
  try {
    const r = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+from+'|'+to);
    const j = await r.json();
    return j.responseData.translatedText;
  } catch(e){ return '(번역 실패 - 인터넷 연결을 확인하세요)'; }
}


// ===== AI 번역 설정 =====
const DEFAULT_MODEL = { claude:'claude-haiku-5-5', openai:'gpt-4o-mini', gemini:'gemini-2.5-flash' };
let cfg = { prov:'google', key:'', model:'', pause:1500 };
try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem('cfg') || '{}')); } catch(e){}
const hist = [];   // 최근 대화(문맥용)

function fillSettings(){
  $('pause').value = String(cfg.pause || 1500); $('prov').value = cfg.prov; $('key').value = cfg.key; $('model').value = cfg.model || DEFAULT_MODEL[cfg.prov] || '';
  const g = $('prov').value === 'google';
  $('keybox').style.display = g ? 'none' : 'block'; $('modelbox').style.display = g ? 'none' : 'block';
}
$('prov').onchange = () => { $('model').value = DEFAULT_MODEL[$('prov').value] || ''; cfg.prov = $('prov').value; 
  const g = $('prov').value === 'google'; $('keybox').style.display = g ? 'none':'block'; $('modelbox').style.display = g ? 'none':'block'; };
$('gear').onclick = () => { fillSettings(); $('setmsg').textContent = ''; $('set').classList.add('show'); };
$('setclose').onclick = () => $('set').classList.remove('show');
$('save').onclick = () => {
  cfg = { prov:$('prov').value, key:$('key').value.trim(), model:$('model').value.trim(), pause:+$('pause').value };
  try { localStorage.setItem('cfg', JSON.stringify(cfg)); } catch(e){}
  $('setmsg').style.color = '#7bd88f'; $('setmsg').textContent = '저장됨 ✓';
  setTimeout(() => $('set').classList.remove('show'), 600);
};
$('test').onclick = async () => {
  cfg = { prov:$('prov').value, key:$('key').value.trim(), model:$('model').value.trim(), pause:+$('pause').value };
  $('setmsg').style.color = '#8b93a3'; $('setmsg').textContent = '테스트 중…';
  try {
    const t = await llmTranslate('The meeting has been moved to three o\'clock.', 'en', 'ko', []);
    $('setmsg').style.color = '#7bd88f'; $('setmsg').textContent = '성공: ' + t;
  } catch(e){ $('setmsg').style.color = '#ff8a8a'; $('setmsg').textContent = '실패: ' + e.message; }
};

const NAME = { en:'English', ko:'Korean' };
async function llmTranslate(text, from, to, ctx){
  const sys = 'You are a professional live interpreter. Translate the speaker\'s words from ' + NAME[from] + ' to ' + NAME[to] +
    '. The text comes from automatic speech recognition, so it may contain recognition errors, missing punctuation, or sentence fragments. ' +
    'Use the previous sentences as context to infer what the speaker really meant, and translate naturally the way a fluent native speaker would say it. ' +
    'Output ONLY the translation, with no notes, explanations or quotation marks.';
  const user = (ctx.length ? 'Previous sentences (context only, do NOT translate):\n' + ctx.map(c => '- ' + c).join('\n') + '\n\n' : '') +
    'Translate this:\n' + text;
  const model = cfg.model || DEFAULT_MODEL[cfg.prov];
  const ac = new AbortController(); const to_ = setTimeout(() => ac.abort(), 15000);
  try {
    let r, j;
    if (cfg.prov === 'claude'){
      r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', signal:ac.signal, headers:{
        'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true' },
        body: JSON.stringify({ model, max_tokens:400, system:sys, messages:[{ role:'user', content:user }] }) });
      j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
      return j.content.map(c => c.text || '').join('').trim();
    }
    if (cfg.prov === 'openai'){
      r = await fetch('https://api.openai.com/v1/chat/completions', { method:'POST', signal:ac.signal, headers:{
        'content-type':'application/json','authorization':'Bearer ' + cfg.key },
        body: JSON.stringify({ model, messages:[{ role:'system', content:sys },{ role:'user', content:user }] }) });
      j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
      return j.choices[0].message.content.trim();
    }
    if (cfg.prov === 'gemini'){
      r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
        method:'POST', signal:ac.signal, headers:{ 'content-type':'application/json','x-goog-api-key':cfg.key },
        body: JSON.stringify({ systemInstruction:{ parts:[{ text:sys }] }, contents:[{ role:'user', parts:[{ text:user }] }] }) });
      j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
      return j.candidates[0].content.parts.map(p => p.text || '').join('').trim();
    }
    throw new Error('엔진 미선택');
  } finally { clearTimeout(to_); }
}

// 확정 문장 번역: AI 설정이 있으면 AI, 실패하면 구글 번역으로 대체
async function translateFinal(text, from, to){
  if (cfg.prov !== 'google' && cfg.key){
    try {
      const t = await llmTranslate(text, from, to, hist.slice(-3));
      hist.push(text); if (hist.length > 6) hist.shift();
      return t;
    } catch(e){ setStatus('AI 번역 오류(' + String(e.message).slice(0,40) + ') → 기본 번역 사용', true); }
  }
  hist.push(text); if (hist.length > 6) hist.shift();
  return translate(text, from, to);
}

function targetOf(lang){ return lang === 'en' ? 'ko' : 'en'; }

// 모아둔 조각을 한 문장으로 확정해서 번역
function flushNow(){
  clearTimeout(flushTimer); clearTimeout(tTimer);
  if (!pendEl) return;
  const el = pendEl, text = pending.trim(), lang = pendLang;
  pendEl = null; pending = '';
  ++seq;
  if (!text){ el.remove(); return; }
  el.classList.remove('live');
  const dst = el.querySelector('.dst');
  if (!dst.textContent) dst.textContent = '…';
  translateFinal(text, L[lang].code, L[targetOf(lang)].code).then(t => {
    dst.textContent = t; logEl.scrollTop = logEl.scrollHeight;
  });
}

function listen(){
  if (!running) return;
  if (mode !== 'auto') cur = mode;
  gotResult = false; lastFinal = '';
  const r = new SR();
  rec = r;
  r.lang = L[cur].rec;
  r.continuous = true;
  r.interimResults = true;
  const lang = cur;

  r.onstart = () => setStatus('듣는 중… (' + L[lang].name + (mode==='auto' ? ', 자동' : '') + ')', true);

  r.onresult = e => {
    gotResult = true;
    let interim = '', gotFinal = false;
    for (let i = e.resultIndex; i < e.results.length; i++){
      const res = e.results[i];
      let text = res[0].transcript.trim();
      if (!text) continue;
      if (res.isFinal){
        const full = text;
        if (lastFinal && text.startsWith(lastFinal)) text = text.slice(lastFinal.length).trim();   // 안드로이드 중복 방지
        lastFinal = full;
        if (text){ pending = (pending ? pending + ' ' : '') + text; gotFinal = true; }
      } else {
        if (lastFinal && text.startsWith(lastFinal)) text = text.slice(lastFinal.length).trim();
        interim = text;
      }
    }
    const display = (pending + ' ' + interim).trim();
    if (!display) return;
    pendLang = lang;
    if (!pendEl){ pendEl = addItem(true); }
    pendEl.querySelector('.src').textContent = display;
    logEl.scrollTop = logEl.scrollHeight;
    clearTimeout(flushTimer); clearTimeout(tTimer);
    if (pending.length > 220){ flushNow(); return; }
    // 말하는 중: 합쳐진 문장 전체를 빠르게 임시 번역
    const el = pendEl, my = ++seq;
    tTimer = setTimeout(() => {
      translate(display, L[lang].code, L[targetOf(lang)].code).then(t => {
        if (my === seq && el === pendEl) el.querySelector('.dst').textContent = t;
      });
    }, 500);
    // 확정 조각만 왔고 더 말이 없으면, 잠깐 쉰 뒤 한 문장으로 확정 번역
    if (!interim) flushTimer = setTimeout(flushNow, cfg.pause || 1500);
  };

  r.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    const msg = {
      'not-allowed':'마이크 권한이 차단되었습니다.\n주소창 왼쪽 아이콘 → 권한 → 마이크 → 허용',
      'service-not-allowed':'이 브라우저/주소에서는 음성인식을 쓸 수 없습니다.\nChrome에서 https:// 주소로 여세요.',
      'network':'음성인식 서버에 연결하지 못했습니다. 인터넷을 확인하세요.',
      'audio-capture':'마이크를 사용할 수 없습니다. 다른 앱이 마이크를 쓰는 중인지 확인하세요.',
      'language-not-supported':'지원하지 않는 언어입니다.'
    };
    setStatus('오류: ' + e.error, false);
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      running = false; showStart(msg[e.error]);
    } else if (msg[e.error]) setStatus(msg[e.error].split('\n')[0], false);
  };

  r.onend = () => {
    dot.classList.remove('on');
    flushNow();
    if (rec !== r) return;
    if (!running) return;
    if (mode === 'auto' && !gotResult) cur = (cur === 'en' ? 'ko' : 'en');   // 조용하면 언어 교대
    setTimeout(listen, 250);
  };

  try { r.start(); } catch(e){ setTimeout(listen, 500); }
}

function stopAll(){
  flushNow();
  running = false;
  if (rec){ const r = rec; rec = null; r.onend = r.onresult = r.onerror = null; try{ r.abort(); }catch(e){} }
  liveEl = null;
}

async function keepAwake(){ try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch(e){} }

// 사용자가 시작 버튼을 누르면 곧바로(대기 없이) 시작 → 권한 팝업이 바로 뜸
function userStart(){
  if (!SR){ showStart('이 브라우저는 음성인식을 지원하지 않습니다.\n안드로이드 Chrome으로 여세요.'); return; }
  if (!window.isSecureContext){ showStart('⚠️ https:// 주소로 열어야 마이크가 작동합니다.\n(현재: ' + location.protocol + ')'); return; }
  stopAll();
  running = true;
  $('start').classList.remove('show');
  listen();
  keepAwake();
}

$('startBtn').onclick = userStart;
$('mode').onclick = () => {
  mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
  try { localStorage.setItem('mode', mode); } catch(e){}
  $('mode').textContent = LABEL[mode];
  stopAll(); running = true; listen();
};
$('clear').onclick = () => { logEl.innerHTML = '<div id="empty">🎧 말씀하시면 여기에<br>번역이 표시됩니다</div>'; liveEl = null; };

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  keepAwake();
  if (!running && !$('start').classList.contains('show')) userStart();
});

// 앱을 열면: 권한이 이미 허용되어 있으면 자동 시작, 아니면 시작 버튼 표시
(async () => {
  if (!SR){ showStart('이 브라우저는 음성인식을 지원하지 않습니다.\n안드로이드 Chrome으로 여세요.'); return; }
  if (!window.isSecureContext){ showStart('⚠️ https:// 주소로 열어야 마이크가 작동합니다.\n(현재: ' + location.protocol + ')'); return; }
  let granted = false;
  try {
    if (navigator.permissions){
      const p = await navigator.permissions.query({ name:'microphone' });
      granted = p.state === 'granted';
    }
  } catch(e){}
  if (granted) userStart(); else showStart('');
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
